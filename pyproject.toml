[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-package"
version = "0.6.0"
description = "Host-neutral, persistent orchestration for Self-Improving Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GunjanGrunge" }]
dependencies = []
keywords = [
    "sia",
    "ai-agent",
    "claude-code",
    "antigravity",
    "codex",
    "bmad",
    "superpowers",
    "self-improving-agents",
    "prompts",
    "skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/GunjanGrunge/SIA_package"
Repository = "https://github.com/GunjanGrunge/SIA_package"
Issues = "https://github.com/GunjanGrunge/SIA_package/issues"
Documentation = "https://gunjangrunge.github.io/SIA_package/"

[project.scripts]
sia = "sia.cli:main"
sia-agent = "sia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sia = ["workflow.md"]

[tool.setuptools.data-files]
"sia_policy" = ["AGENT.md", "capture-interface.md", "guides/*.md"]
